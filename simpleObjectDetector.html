<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Source AI: Object Detector</title>
    <meta name="author" content="Vishal Kalansooriya">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #38bdf8, #34d399);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        div {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 480px;
            width: 100%;
            box-sizing: border-box;
        }
        video {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            border: 2px solid #334155;
            border-radius: 12px;
            object-fit: cover;
            display: block;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
            transform: scaleX(-1); /* Mirror the video for a more natural webcam view */
        }
        h1 {
            margin-top: 24px;
            font-size: 18px;
            font-weight: 600;
            padding: 14px 20px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            width: 100%;
            box-sizing: border-box;
            letter-spacing: 0.3px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div>
        <h2>Open Source AI: Object Detector</h2>
        <p>Show a phone, cup, or bottle to the camera!</p>

        <!-- 1. Live camera feed video element -->
        <video id="webcam" autoplay playsinline muted></video>

        <!-- 2. Message box to display detection results -->
        <h1 id="message">Loading AI Model... Please Wait.</h1>
    </div>

    <!-- 3. Import Google MediaPipe Object Detector library using ES Module script -->
    <script type="module">
        // Import ObjectDetector and FilesetResolver from MediaPipe Tasks Vision CDN
        // All mediapipe model data are available in https://developers.google.com/edge/mediapipe/solutions/guide
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

        // Reference HTML elements by their IDs
        const video = document.getElementById("webcam");
        const messageBox = document.getElementById("message");

        let objectDetector; // Variable to store our AI model instance



        // STEP 1: Initialize MediaPipe AI model and start webcam stream
        async function setupAI() {
            // Load WebAssembly runtime files required by MediaPipe
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
            );

            // Create and configure the Object Detector model using float16 for smooth browser performance
            objectDetector = await ObjectDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float32/1/efficientdet_lite0.tflite"
                },
                runningMode: "VIDEO",
                scoreThreshold: 0.5 // Require at least 50% confidence score
            });

            // Request user permission and attach webcam stream to video element
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;

            // Once video data is loaded, update message and start detection loop
            video.onloadeddata = () => {
                messageBox.innerHTML = "AI Ready! Show an object";
                detectObjects();
            };
        }


        
        // STEP 2: Continuous loop to detect objects in the live video frames
        function detectObjects() {
            // Process the current video frame using the AI object detector
            const results = objectDetector.detectForVideo(video, performance.now());

            // Check if any objects are detected in the frame
            if (results.detections.length > 0) {
                // Extract object name and confidence score percentage
                const objectName = results.detections[0].categories[0].categoryName;
                const confidence = Math.round(results.detections[0].categories[0].score * 100);

                // Update message box with detected object info
                messageBox.innerHTML = `📦 Detected: <b>${objectName}</b> (${confidence}%)`;
                messageBox.style.color = "#34d399"; // Neon Green
            } else {
                // If no recognizable object is found
                messageBox.innerHTML = "🔍 Looking for objects...";
                messageBox.style.color = "#38bdf8"; // Neon Blue
            }

            // Repeat the detection loop on the next animation frame (~60 FPS)
            requestAnimationFrame(detectObjects);
        }

        // Run setup when the page loads
        setupAI();
    </script>

</body>
</html>
